<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUZZ&BOOM Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loginPage">

<h1>BUZZ&BOOM ADMIN</h1>

<div class="loginBox">

<h2>Administrator Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

</div>



<div id="dashboard" style="display:none;">

<header>

<h1>BUZZ&BOOM ADMIN</h1>

<nav>

<a href="index.html">Store</a>

<button onclick="logout()">

Logout

</button>

</nav>

</header>

<section class="admin-panel">

<h2>Add Product</h2>

<input
type="text"
id="name"
placeholder="Product Name">

<input
type="number"
id="price"
placeholder="Price">

<textarea
id="description"
placeholder="Description">
</textarea>

<label>Select Images</label>

<input
type="file"
id="images"
multiple
accept="image/*">

<br><br>

<button onclick="uploadProduct()">

Publish Product

</button>

</section>


<section>

<h2>Products</h2>

<div id="adminProducts"></div>

</section>

</div>

<script src="script.js"></script>

</body>

</html>
