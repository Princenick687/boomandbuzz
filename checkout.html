<!DOCTYPE html>
<html>

<head>
    <title>BUZZ&BOOM Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<header>
    <h1>BUZZ&BOOM</h1>
    <a href="cart.html">Back to Cart</a>
</header>


<section>

<h2>Checkout</h2>


<label>
Full Name
</label>
<br>

<input id="name" type="text" placeholder="Enter your name">

<br><br>


<label>
Phone Number
</label>
<br>

<input id="phone" type="text" placeholder="07XXXXXXXX">

<br><br>


<label>
Delivery Location
</label>
<br>

<input id="location" type="text" placeholder="Where should we deliver?">

<br><br>


<label>
Payment Method
</label>

<br>

<select id="payment">

<option> M-Pesa </option>

<option> Pay on Delivery </option>

</select>


<br><br>


<button onclick="placeOrder()">
Place Order
</button>


</section>


<script src="script.js"></script>


</body>

</html>
